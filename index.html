<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>かかし訓練クリッカー - コスト比例強化版</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #228B22; /* 草原の緑 */
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 獲得ポイント */
        #score-display {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 訓練用かかし */
        #kakashi {
            width: 130px;
            height: 130px;
            background-color: #8B4513;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.05s;
            margin-bottom: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        #kakashi:active { transform: scale(0.92); }
        .kakashi-title { font-size: 1.1rem; font-weight: bold; }
        .kakashi-sub { font-size: 0.85rem; color: #FFD700; font-weight: bold; margin-top: 4px; transition: color 0.1s; }

        /* セクション共通タイトル */
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #FFD700;
            padding-bottom: 3px;
            width: 90%;
            max-width: 360px;
        }

        /* 通常アップグレードエリア */
        .upgrade-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 360px;
        }
        .btn {
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #323232;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #btn-auto { background-color: #D2B48C; }
        #btn-click { background-color: #F4A460; }
        .btn:disabled {
            background-color: #999999 !important;
            color: #666666;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-sub { font-size: 0.75rem; font-weight: normal; margin-top: 2px; opacity: 0.9; }

        /* スキルツリーエリア */
        .skill-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 90%;
            max-width: 360px;
        }
        .skill-btn {
            padding: 10px 5px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            background-color: #4b6b4b;
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .skill-btn.available { background-color: #4682B4; border-color: #FFF; }
        .skill-btn.available:disabled { background-color: #2F4F4F; color: #aaaaaa; }
        .skill-btn.learned { background-color: #FF8C00; border-color: #FFD700; cursor: default; }
        .skill-cost { font-size: 0.7rem; color: #FFD700; }
        .skill-btn.learned .skill-cost { color: #FFF; }

        /* 装備エリア */
        .equip-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 360px;
        }
        .equip-item {
            background-color: #3a5f3a;
            border: 1px solid #fff;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .equip-info { text-align: left; }
        .equip-name { font-weight: bold; }
        .equip-effect { font-size: 0.75rem; color: #ccc; }
        
        .equip-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .eq-buy { background-color: #FFD700; color: #333; }
        .eq-buy:disabled { background-color: #888; color: #555; }
        .eq-ready { background-color: #FFF; color: #333; }
        .eq-now { background-color: #ADFF2F; color: #333; cursor: default; }

        /* ステータス表示 */
        #status-display {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #E0E0E0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="score-display">獲得ポイント：<span id="score">0</span>点</div>

    <div id="kakashi" onclick="attackKakashi()">
        <div class="kakashi-title">訓練用かかし</div>
        <div id="kakashi-sub" class="kakashi-sub">＼攻撃せよ！／</div>
    </div>

    <div class="section-title">基礎能力の強化</div>
    <div class="upgrade-container">
        <button id="btn-auto" class="btn" onclick="buyAutoClick()">
            <span>仲間の自動攻撃を雇う（コスト：<span id="cost-auto">10</span>）</span>
            <span class="btn-sub">次の強化幅：＋<span id="gain-auto">0.5</span>点</span>
        </button>
        <button id="btn-click" class="btn" onclick="buyClickUpgrade()">
            <span>自分の攻撃力を鍛える（コスト：<span id="cost-click">15</span>）</span>
            <span class="btn-sub">次の強化幅：＋<span id="gain-click">1</span>点</span>
        </button>
    </div>

    <div class="section-title">武器の装備</div>
    <div class="equip-container">
        <div class="equip-item">
            <div class="equip-info">
                <div class="equip-name">ボロい素手</div>
                <div class="equip-effect">効果：なし</div>
            </div>
            <button id="eqbtn-w0" class="equip-btn eq-now" onclick="changeEquip('w0')">装備中</button>
        </div>
        <div class="equip-item">
            <div class="equip-info">
                <div class="equip-name">銅のつるぎ</div>
                <div class="equip-effect">効果：自身の攻撃力＋１５点</div>
            </div>
            <button id="eqbtn-w1" class="equip-btn eq-buy" onclick="actionEquip('w1')">購入:150点</button>
        </div>
        <div class="equip-item">
            <div class="equip-info">
                <div class="equip-name">魔導の杖</div>
                <div class="equip-effect">効果：自身の攻撃力＋８０点</div>
            </div>
            <button id="eqbtn-w2" class="equip-btn eq-buy" onclick="actionEquip('w2')">購入:800点</button>
        </div>
    </div>

    <div class="section-title">特訓スキルツリー</div>
    <div class="skill-grid">
        <button idsk="s1" class="skill-btn" onclick="buySkill('s1')">
            <span>【攻撃】木刀の極意</span>
            <span>（自身の攻撃力＋５）</span>
            <span class="skill-cost" id="cost-s1">コスト：50点</span>
        </button>
        <button idsk="s2" class="skill-btn" onclick="buySkill('s2')">
            <span>【自動】口笛のコツ</span>
            <span>（自動攻撃力＋３）</span>
            <span class="skill-cost" id="cost-s2">コスト：80点</span>
        </button>
        <button idsk="s3" class="skill-btn" onclick="buySkill('s3')">
            <span>【前提:木刀】鉄剣錬成</span>
            <span>（自身の攻撃力＋２０）</span>
            <span class="skill-cost" id="cost-s3">コスト：300点</span>
        </button>
        <button idsk="s4" class="skill-btn" onclick="buySkill('s4')">
            <span>【前提:口笛】熱血指導</span>
            <span>（自動攻撃力＋１5）</span>
            <span class="skill-cost" id="cost-s4">コスト：500点</span>
        </button>
    </div>

    <div id="status-display">
        現在の能力 ｜ 自分の攻撃力：<span id="power-click">1</span>点<br>
        仲間の自動攻撃力：毎秒<span id="power-auto">0</span>点
    </div>

    <script>
        // --- ゲームの変数の初期化 ---
        let score = 0;
        let baseClickPower = 1;
        let baseAutoClickRate = 0;

        let upgradeCost = 10;
        let clickUpgradeCost = 15;
        
        // ★ 次の強化で購入したときに増える量（初期値）
        let autoClickGain = 0.5;
        let clickPowerGain = 1;

        let critTimeout = null;

        // スキルツリーのデータ
        const skills = {
            s1: { name: "木刀の極意", cost: 50,  learned: false, req: null, type: "click", value: 5 },
            s2: { name: "口笛のコツ", cost: 80,  learned: false, req: null, type: "auto",  value: 3 },
            s3: { name: "鉄剣錬成",   cost: 300, learned: false, req: "s1", type: "click", value: 20 },
            s4: { name: "熱血指導",   cost: 500, learned: false, req: "s2", type: "auto",  value: 15 }
        };

        // 装備品のデータ
        let currentWeapon = "w0";
        const equips = {
            w0: { name: "ボロい素手", cost: 0,    bought: true,  value: 0 },
            w1: { name: "銅のつるぎ", cost: 150,  bought: false, value: 15 },
            w2: { name: "魔導の杖",   cost: 800,  bought: false, value: 80 }
        };

        function getClickPower() {
            let power = baseClickPower;
            if (skills.s1.learned) power += skills.s1.value;
            if (skills.s3.learned) power += skills.s3.value;
            power += equips[currentWeapon].value;
            return power;
        }

        function getAutoClickRate() {
            let rate = baseAutoClickRate;
            if (skills.s2.learned) rate += skills.s2.value;
            if (skills.s4.learned) rate += skills.s4.value;
            return rate;
        }

        // --- 画面の表示を更新する関数 ---
        function updateDisplay() {
            document.getElementById("score").innerText = Math.floor(score);
            document.getElementById("cost-auto").innerText = upgradeCost;
            document.getElementById("cost-click").innerText = clickUpgradeCost;
            
            // ★ 次の強化幅の数値を画面に反映
            document.getElementById("gain-auto").innerText = Number.isInteger(autoClickGain) ? autoClickGain : autoClickGain.toFixed(1);
            document.getElementById("gain-click").innerText = clickPowerGain;

            document.getElementById("power-click").innerText = getClickPower();
            
            let displayAutoRate = getAutoClickRate();
            document.getElementById("power-auto").innerText = Number.isInteger(displayAutoRate) ? displayAutoRate : displayAutoRate.toFixed(1);

            // ボタン活性・非活性制御
            document.getElementById("btn-auto").disabled = (score < upgradeCost);
            document.getElementById("btn-click").disabled = (score < clickUpgradeCost);

            // スキルツリー
            for (let id in skills) {
                let sk = skills[id];
                let btn = document.querySelector(`[idsk="${id}"]`);
                let isUnlocked = (sk.req === null || skills[sk.req].learned);
                if (sk.learned) {
                    btn.className = "skill-btn learned";
                    btn.disabled = true;
                    document.getElementById(`cost-${id}`).innerText = "習得済み";
                } else if (isUnlocked) {
                    btn.className = "skill-btn available";
                    btn.disabled = (score < sk.cost);
                } else {
                    btn.className = "skill-btn";
                    btn.disabled = true;
                }
            }

            // 装備品
            for (let id in equips) {
                let eq = equips[id];
                let btn = document.getElementById(`eqbtn-${id}`);
                if (currentWeapon === id) {
                    btn.className = "equip-btn eq-now"; btn.innerText = "装備中"; btn.disabled = true;
                } else if (eq.bought) {
                    btn.className = "equip-btn eq-ready"; btn.innerText = "装備する"; btn.disabled = false;
                } else {
                    btn.className = "equip-btn eq-buy"; btn.innerText = "購入:" + eq.cost + "点"; btn.disabled = (score < eq.cost);
                }
            }
        }

        // かかしを攻撃
        function attackKakashi() {
            let power = getClickPower();
            let isCritical = Math.random() < 0.05; 
            const subText = document.getElementById("kakashi-sub");

            if (isCritical) {
                power *= 3;
                subText.innerText = "💥クリティカル！💥";
                subText.style.color = "#FF4500";
                if (critTimeout) clearTimeout(critTimeout);
                critTimeout = setTimeout(() => {
                    subText.innerText = "＼攻撃せよ！／";
                    subText.style.color = "#FFD700";
                }, 400);
            }

            score += power;
            updateDisplay();
        }

        // --- 通常アップグレード（コスト比例システム） ---
        function buyAutoClick() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                baseAutoClickRate += autoClickGain; // 現在の強化幅を加算
                
                // コストを1.5倍にする
                upgradeCost = Math.floor(upgradeCost * 1.5);
                
                // ★【比例】次の強化幅を「新コストの5%」に設定（最低でも0.5は保証）
                autoClickGain = Math.max(0.5, parseFloat((upgradeCost * 0.05).toFixed(1)));
                
                updateDisplay();
            }
        }
        
        function buyClickUpgrade() {
            if (score >= clickUpgradeCost) {
                score -= clickUpgradeCost;
                baseClickPower += clickPowerGain; // 現在の強化幅を加算
                
                // コストを1.7倍にする
                clickUpgradeCost = Math.floor(clickUpgradeCost * 1.7);
                
                // ★【比例】次の強化幅を「新コストの10%」に設定（最低でも1は保証）
                clickPowerGain = Math.max(1, Math.floor(clickUpgradeCost * 0.1));
                
                updateDisplay();
            }
        }

        // 装備品アクション
        function actionEquip(id) {
            let eq = equips[id];
            if (!eq.bought && score >= eq.cost) {
                score -= eq.cost; eq.bought = true; currentWeapon = id; updateDisplay();
            } else if (eq.bought) {
                currentWeapon = id; updateDisplay();
            }
        }
        function changeEquip(id) { currentWeapon = id; updateDisplay(); }

        // スキル習得
        function buySkill(id) {
            let sk = skills[id];
            let isUnlocked = (sk.req === null || skills[sk.req].learned);
            if (isUnlocked && !sk.learned && score >= sk.cost) {
                score -= sk.cost; sk.learned = true; updateDisplay();
            }
        }

        // 仲間の自動攻撃ループ
        setInterval(function() {
            let rate = getAutoClickRate();
            if (rate > 0) {
                score += rate * (1 / 60);
                updateDisplay();
            }
        }, 1000 / 60);

        updateDisplay();
    </script>
</body>
</html>
