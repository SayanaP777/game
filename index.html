<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>かかし訓練クリッカー - セリフ堪能版</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #228B22;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        #score-display {
            font-size: 2rem;
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #level-display {
            font-size: 1.1rem;
            color: #FFD700;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .hp-container {
            width: 200px;
            background-color: #555;
            border: 2px solid #fff;
            border-radius: 10px;
            height: 20px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background-color: #ff3333;
            transition: width 0.1s ease-out;
        }
        .hp-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            left: 0;
            font-size: 0.8rem;
            line-height: 20px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px #000;
        }

        #merchant-banner {
            display: none;
            background-color: #D2691E;
            border: 2px solid #FFD700;
            color: white;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 0.9rem;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        #kakashi {
            width: 130px;
            height: 130px;
            background-color: #8B4513;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.05s, background-color 0.3s;
            margin-bottom: 20px;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        #kakashi:active { transform: scale(0.92); }
        .kakashi-title { font-size: 1.1rem; font-weight: bold; }
        .kakashi-sub { font-size: 0.85rem; color: #FFD700; font-weight: bold; margin-top: 4px; transition: color 0.1s; }

        .bubble {
            display: none;
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            color: #333;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .bubble:after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }
        /* アニメーションの共通定義（秒数はJS側で上書きします） */
        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-15px); }
        }
        .bubble.show {
            display: block;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #FFD700;
            padding-bottom: 3px;
            width: 90%;
            max-width: 360px;
        }

        .upgrade-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 360px;
        }
        .btn {
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #323232;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #btn-auto { background-color: #D2B48C; }
        #btn-click { background-color: #F4A460; }
        .btn:disabled {
            background-color: #999999 !important;
            color: #666666;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-sub { font-size: 0.75rem; font-weight: normal; margin-top: 2px; opacity: 0.9; }

        .bonus-badge {
            font-size: 0.7rem;
            background-color: #FF1493;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: bold;
        }

        .skill-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 90%;
            max-width: 360px;
        }
        .skill-btn {
            padding: 10px 5px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            background-color: #4b6b4b;
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .skill-btn.available { background-color: #4682B4; border-color: #FFF; }
        .skill-btn.available:disabled { background-color: #2F4F4F; color: #aaaaaa; }
        .skill-btn.learned { background-color: #FF8C00; border-color: #FFD700; cursor: default; }
        .skill-cost { font-size: 0.7rem; color: #FFD700; }
        .skill-btn.learned .skill-cost { color: #FFF; }

        .equip-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 360px;
        }
        .equip-item {
            background-color: #3a5f3a;
            border: 1px solid #fff;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .equip-info { text-align: left; }
        .equip-name { font-weight: bold; }
        .equip-effect { font-size: 0.75rem; color: #ccc; }
        
        .equip-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .eq-buy { background-color: #FFD700; color: #333; }
        .eq-buy:disabled { background-color: #888; color: #555; }
        .eq-sale { background-color: #FF4500; color: white; animation: flash 0.8s infinite alternate; }
        .eq-sale:disabled { background-color: #888; color: #555; animation: none; }
        
        .eq-ready { background-color: #FFF; color: #333; }
        .eq-now { background-color: #ADFF2F; color: #333; cursor: default; }

        @keyframes flash {
            0% { box-shadow: 0 0 2px #FFD700; }
            100% { box-shadow: 0 0 10px #FFD700; }
        }

        #status-display {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #E0E0E0;
            line-height: 1.5;
        }

        .save-container {
            margin-top: 30px;
            width: 90%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .save-msg {
            font-size: 0.75rem;
            color: #FFD700;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .save-msg.active { opacity: 1; }
        .btn-reset {
            background-color: #8b2525;
            color: white;
            border: 1px solid #ff8888;
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="score-display">所持金：<span id="score">0</span>ゴールド</div>
    <div id="level-display"><span id="enemy-status-text">かかし討伐数：0 / 10体</span> (通算: <span id="kakashi-lv">0</span>体)</div>

    <div id="merchant-banner">
        💰 行商人がやってきた！武器1つだけ30%OFF！ 💰<br>
        <span style="font-size: 0.8rem; color: #FFD700;">（あとしばらくで帰ってしまう！ 残り: <span id="merchant-timer">20</span>秒）</span>
    </div>

    <div class="hp-container">
        <div id="hp-bar" class="hp-bar"></div>
        <div id="hp-text" class="hp-text">HP: 10 / 10</div>
    </div>

    <div id="kakashi" onclick="attackKakashi()">
        <div id="kakashi-bubble" class="bubble">いてっ</div>
        <div id="enemy-name" class="kakashi-title">訓練用かかし</div>
        <div id="kakashi-sub" class="kakashi-sub">＼攻撃せよ！／</div>
    </div>

    <div class="section-title">基礎能力の強化</div>
    <div class="upgrade-container">
        <button id="btn-auto" class="btn" onclick="buyAutoClick()">
            <span>自動攻撃を雇う [Lv.<span id="lv-auto">0</span>]<span id="badge-auto" class="bonus-badge">新兵割引</span> （コスト：<span id="cost-auto">100</span>）</span>
            <span class="btn-sub">次の強化幅：＋<span id="gain-auto">0.5</span>ダメージ</span>
        </button>
        <button id="btn-click" class="btn" onclick="buyClickUpgrade()">
            <span>攻撃力を鍛える [Lv.<span id="lv-click">0</span>]<span id="badge-click" class="bonus-badge">新兵割引</span> （コスト：<span id="cost-click">150</span>）</span>
            <span class="btn-sub">次の強化幅：＋<span id="gain-click">1</span>ダメージ</span>
        </button>
    </div>

    <div class="section-title">武器の装備</div>
    <div class="equip-container">
        <div class="equip-item">
            <div class="equip-info">
                <div class="equip-name">ボロい素手</div>
                <div class="equip-effect">効果：なし</div>
            </div>
            <button id="eqbtn-w0" class="equip-btn eq-now" onclick="changeEquip('w0')">装備中</button>
        </div>
        <div class="equip-item">
            <div class="equip-info">
                <div class="equip-name">銅のつるぎ</div>
                <div class="equip-effect">効果：自身の攻撃力＋１５０ダメージ</div>
            </div>
            <button id="eqbtn-w1" class="equip-btn eq-buy" onclick="actionEquip('w1')">購入:1500G</button>
        </div>
        <div class="equip-item">
            <div class="equip-info">
                <div class="equip-name">魔導の杖</div>
                <div class="equip-effect">効果：自身の攻撃力＋１０00ダメージ</div>
            </div>
            <button id="eqbtn-w2" class="equip-btn eq-buy" onclick="actionEquip('w2')">購入:10000G</button>
        </div>
    </div>

    <div class="section-title">特訓スキルツリー</div>
    <div class="skill-grid">
        <button idsk="s1" class="skill-btn" onclick="buySkill('s1')">
            <span>【攻撃】木刀の極意</span>
            <span>（自身の攻撃力＋５０）</span>
            <span class="skill-cost" id="cost-s1">コスト：500G</span>
        </button>
        <button idsk="s2" class="skill-btn" onclick="buySkill('s2')">
            <span>【自動】口笛のコツ</span>
            <span>（自動攻撃力＋３５）</span>
            <span class="skill-cost" id="cost-s2">コスト：700G</span>
        </button>
        <button idsk="s3" class="skill-btn" onclick="buySkill('s3')">
            <span>【前提:木刀】鉄剣錬成</span>
            <span>（自身の攻撃力＋３０0）</span>
            <span class="skill-cost" id="cost-s3">コスト：3000G</span>
        </button>
        <button idsk="s4" class="skill-btn" onclick="buySkill('s4')">
            <span>【前提:口笛】熱血指導</span>
            <span>（自動攻撃力＋２５０）</span>
            <span class="skill-cost" id="cost-s4">コスト：5000G</span>
        </button>
    </div>

    <div id="status-display">
        現在の能力 ｜ 自分の攻撃力：<span id="power-click">1</span>ダメージ<br>
        仲間の自動攻撃力：毎秒<span id="power-auto">0</span>ダメージ
    </div>

    <div class="save-container">
        <span id="save-status" class="save-msg">🔄 オートセーブ完了</span>
        <button class="btn-reset" onclick="resetGame()">データを削除して最初から</button>
    </div>

    <script>
        let score = 0; 
        let baseClickPower = 1;
        let baseAutoClickRate = 0;

        let upgradeCost = 100;
        let clickUpgradeCost = 150;
        
        let autoClickGain = 0.5;
        let clickPowerGain = 1;

        let autoCount = 0;
        let clickCount = 0;

        let kakashiDefeated = 0;  

        const enemyDataList = [
            { 
                name: "訓練用かかし", hp: 10, reward: 15, color: "#8B4513", nextCount: 10,
                phrases: ["いてっ", "きくぅー", "まだまだ！", "そこだ！"],
                critPhrases: ["ぎゃあああ！", "す、すごい！", "ふげぇっ！"],
                koPhrases: ["バタッ（昇天）", "見事なり…！", "強くなったなぁ"],
                idlePhrases: ["…喋ってもいい？", "叩いてくれないと寂しいな", "修行の成果を見せてみよ！"]
            },
            { 
                name: "ぷるぷるスライム", hp: 50, reward: 45, color: "#1E90FF", nextCount: 15,
                phrases: ["ぴきっ", "ぷるんっ", "つめたい？", "ひゃんっ"],
                critPhrases: ["びよーーーん！", "ちぎれるぅ！", "平べったくなった！"],
                koPhrases: ["ピキィ！（分裂）", "とけていくぅ…", "水たまりになった"],
                idlePhrases: ["ぷるぷる…寝ちゃうぞ", "おーい、みずあめじゃないよ", "放置されると乾いちゃう…"]
            },
            { 
                name: "やんちゃゴブリン", hp: 200, reward: 180, color: "#2E8B57", nextCount: 20,
                phrases: ["痛えな！", "効かねえよ！", "おいおい！", "あぶねっ"],
                critPhrases: ["ギャフン！", "クソォオオ！", "目がまわるぅ！"],
                koPhrases: ["おぼえてろよー！", "うわあああ！", "ちくしょー！"],
                idlePhrases: ["ビビってんのか？", "早くかかってこいよ！", "お前の財布、狙っちゃおうかなー"]
            },
            { 
                name: "見習いドラゴン", hp: 800, reward: 700, color: "#DC143C", nextCount: Infinity,
                phrases: ["フハハ！", "くすぐったいぞ", "我が皮膚は硬い", "ぬるいな"],
                critPhrases: ["グオオオ！？", "やるではないか！", "ガハッ…やるな！"],
                koPhrases: ["見事な一撃だ…", "眠りにつくとしよう", "完敗だ…"],
                idlePhrases: ["退屈させないでくれ", "人間よ、恐れをなしたか？", "ふぁぁ…（あくびの炎）"]
            }
        ];
        let currentEnemyIdx = 0;       
        let currentEnemyDefeated = 0;  
        
        let kakashiMaxHp = 10;
        let kakashiHp = 10;

        let critTimeout = null;
        let bubbleTimeout = null;
        let saveMsgTimeout = null;
        let secondsSinceLastTap = 0; 

        let isMerchantPresent = false;
        let merchantTimeLeft = 0;
        let merchantInterval = null;

        const skills = {
            s1: { name: "木刀の極意", cost: 500,  learned: false, req: null, type: "click", value: 50 },
            s2: { name: "口笛のコツ", cost: 700,  learned: false, req: null, type: "auto",  value: 35 },
            s3: { name: "鉄剣錬成",   cost: 3000, learned: false, req: "s1", type: "click", value: 300 },
            s4: { name: "熱血指導",   cost: 5000, learned: false, req: "s2", type: "auto",  value: 250 }
        };

        const equips = {
            w0: { name: "ボロい素手", cost: 0,     bought: true,  value: 0 },
            w1: { name: "銅のつるぎ", cost: 1500,  bought: false, value: 150 },
            w2: { name: "魔導の杖",   cost: 10000, bought: false, value: 1000 }
        };
        let currentWeapon = "w0";

        function getClickPower() {
            let power = baseClickPower;
            if (skills.s1.learned) power += skills.s1.value;
            if (skills.s3.learned) power += skills.s3.value;
            power += equips[currentWeapon].value;
            return power;
        }

        function getAutoClickRate() {
            let rate = baseAutoClickRate;
            if (skills.s2.learned) rate += skills.s2.value;
            if (skills.s4.learned) rate += skills.s4.value;
            return rate;
        }

        function updateDisplay() {
            let currentEnemy = enemyDataList[currentEnemyIdx];

            document.getElementById("score").innerText = Math.floor(score);
            document.getElementById("kakashi-lv").innerText = kakashiDefeated;
            
            document.getElementById("enemy-name").innerText = currentEnemy.name;
            document.getElementById("kakashi").style.backgroundColor = currentEnemy.color;
            
            if (currentEnemy.nextCount === Infinity) {
                document.getElementById("enemy-status-text").innerText = `${currentEnemy.name}出現中！`;
            } else {
                document.getElementById("enemy-status-text").innerText = `${currentEnemy.name}討伐数：${currentEnemyDefeated} / ${currentEnemy.nextCount}体`;
            }

            let hpPercent = Math.max(0, (kakashiHp / kakashiMaxHp) * 100);
            document.getElementById("hp-bar").style.width = hpPercent + "%";
            document.getElementById("hp-text").innerText = `HP: ${Math.floor(kakashiHp)} / ${kakashiMaxHp}`;

            document.getElementById("cost-auto").innerText = upgradeCost;
            document.getElementById("cost-click").innerText = clickUpgradeCost;
            document.getElementById("lv-auto").innerText = autoCount;
            document.getElementById("lv-click").innerText = clickCount;

            document.getElementById("badge-auto").style.display = (autoCount < 5) ? "inline" : "none";
            document.getElementById("badge-click").style.display = (clickCount < 5) ? "inline" : "none";
            
            document.getElementById("gain-auto").innerText = autoClickGain < 10 ? autoClickGain.toFixed(1) : Math.floor(autoClickGain);
            document.getElementById("gain-click").innerText = Math.floor(clickPowerGain);

            document.getElementById("power-click").innerText = Math.floor(getClickPower());
            let displayAutoRate = getAutoClickRate();
            document.getElementById("power-auto").innerText = displayAutoRate < 10 ? displayAutoRate.toFixed(1) : Math.floor(displayAutoRate);

            document.getElementById("btn-auto").disabled = (score < upgradeCost);
            document.getElementById("btn-click").disabled = (score < clickUpgradeCost);

            for (let id in skills) {
                let sk = skills[id];
                let btn = document.querySelector(`[idsk="${id}"]`);
                let isUnlocked = (sk.req === null || skills[sk.req].learned);
                if (sk.learned) {
                    btn.className = "skill-btn learned"; btn.disabled = true;
                    document.getElementById(`cost-${id}`).innerText = "習得済み";
                } else if (isUnlocked) {
                    btn.className = "skill-btn available"; btn.disabled = (score < sk.cost);
                } else {
                    btn.className = "skill-btn"; btn.disabled = true;
                }
            }

            for (let id in equips) {
                let eq = equips[id];
                let btn = document.getElementById(`eqbtn-${id}`);
                let isSaleTarget = (isMerchantPresent && !eq.bought && eq.cost > 0);
                let currentCost = isSaleTarget ? Math.floor(eq.cost * 0.7) : eq.cost;

                if (currentWeapon === id) {
                    btn.className = "equip-btn eq-now"; btn.innerText = "装備中"; btn.disabled = true;
                } else if (eq.bought) {
                    btn.className = "equip-btn eq-ready"; btn.innerText = "装備する"; btn.disabled = false;
                } else {
                    btn.innerText = (isMerchantPresent ? "特売:" : "購入:") + currentCost + "G";
                    btn.className = isMerchantPresent ? "equip-btn eq-sale" : "equip-btn eq-buy";
                    btn.disabled = (score < currentCost);
                }
            }
        }

        function damageKakashi(amount) {
            kakashiHp -= amount;
            let currentEnemy = enemyDataList[currentEnemyIdx];
            
            if (kakashiHp <= 0) {
                kakashiDefeated++;
                currentEnemyDefeated++;
                
                let reward = currentEnemy.reward;
                score += reward;

                const bubble = document.getElementById("kakashi-bubble");
                bubble.innerText = currentEnemy.koPhrases[Math.floor(Math.random() * currentEnemy.koPhrases.length)] + ` (+${reward}G)`;
                
                // ★KOセリフは長めの【3秒】表示に！じわじわ消える速度も同期
                bubble.style.animation = "fadeOutUp 3s forwards";
                bubble.classList.remove("show");
                void bubble.offsetWidth;
                bubble.classList.add("show");
                
                if (bubbleTimeout) clearTimeout(bubbleTimeout);
                bubbleTimeout = setTimeout(() => { bubble.classList.remove("show"); }, 3000);

                if (currentEnemyDefeated >= currentEnemy.nextCount && currentEnemyIdx < enemyDataList.length - 1) {
                    currentEnemyIdx++;
                    currentEnemyDefeated = 0;
                    currentEnemy = enemyDataList[currentEnemyIdx];
                }

                kakashiMaxHp = currentEnemy.hp;
                kakashiHp = kakashiMaxHp;

                if (!isMerchantPresent) {
                    let hasUnboughtWeapon = Object.keys(equips).some(id => id !== 'w0' && !equips[id].bought);
                    if (hasUnboughtWeapon && Math.random() < 0.08) {
                        triggerMerchant();
                    }
                }
            }
        }

        function attackKakashi() {
            secondsSinceLastTap = 0;

            let currentEnemy = enemyDataList[currentEnemyIdx];
            let power = getClickPower();
            let isCritical = Math.random() < 0.05; 
            const subText = document.getElementById("kakashi-sub");
            const bubble = document.getElementById("kakashi-bubble");

            let phraseList = currentEnemy.phrases;

            if (isCritical) {
                power *= 3;
                subText.innerText = "💥クリティカル！💥";
                subText.style.color = "#FF4500";
                phraseList = currentEnemy.critPhrases;

                if (critTimeout) clearTimeout(critTimeout);
                critTimeout = setTimeout(() => {
                    subText.innerText = "＼攻撃せよ！／";
                    subText.style.color = "#FFD700";
                }, 400);
            }

            if (kakashiHp - power > 0) {
                const randomPhrase = phraseList[Math.floor(Math.random() * phraseList.length)];
                bubble.innerText = randomPhrase;
                
                // ★通常セリフは少しゆったりの【2秒】表示に変更
                bubble.style.animation = "fadeOutUp 2s forwards";
                bubble.classList.remove("show");
                void bubble.offsetWidth;
                bubble.classList.add("show");
                
                if (bubbleTimeout) clearTimeout(bubbleTimeout);
                bubbleTimeout = setTimeout(() => { bubble.classList.remove("show"); }, 2000);
            }

            damageKakashi(power);
            updateDisplay();
        }

        function checkIdleTime() {
            secondsSinceLastTap++;
            
            if (secondsSinceLastTap >= 10) {
                secondsSinceLastTap = 0; 
                
                let currentEnemy = enemyDataList[currentEnemyIdx];
                const bubble = document.getElementById("kakashi-bubble");
                
                if (kakashiHp > 0) {
                    const randomIdlePhrase = currentEnemy.idlePhrases[Math.floor(Math.random() * currentEnemy.idlePhrases.length)];
                    bubble.innerText = "💬 " + randomIdlePhrase;
                    
                    // ★放置セリフは一番長い【3.5秒】表示に！見逃しを防ぎます
                    bubble.style.animation = "fadeOutUp 3.5s forwards";
                    bubble.classList.remove("show");
                    void bubble.offsetWidth;
                    bubble.classList.add("show");
                    
                    if (bubbleTimeout) clearTimeout(bubbleTimeout);
                    bubbleTimeout = setTimeout(() => { bubble.classList.remove("show"); }, 3500); 
                }
            }
        }

        function triggerMerchant() {
            isMerchantPresent = true;
            merchantTimeLeft = 20;
            document.getElementById("merchant-banner").style.display = "block";
            
            if (merchantInterval) clearInterval(merchantInterval);
            merchantInterval = setInterval(() => {
                merchantTimeLeft--;
                document.getElementById("merchant-timer").innerText = merchantTimeLeft;
                if (merchantTimeLeft <= 0) { endMerchant(); }
            }, 1000);
            updateDisplay();
        }

        function endMerchant() {
            isMerchantPresent = false;
            clearInterval(merchantInterval);
            document.getElementById("merchant-banner").style.display = "none";
            updateDisplay();
        }

        function buyAutoClick() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                baseAutoClickRate += autoClickGain;
                autoCount++;
                let multiplier = 1.2;
                if (autoCount >= 5) { multiplier = 2.0 + (autoCount * 0.10); }
                upgradeCost = Math.floor(upgradeCost * multiplier);
                autoClickGain = Math.max(0.5, parseFloat((upgradeCost * 0.03).toFixed(1)));
                updateDisplay();
                saveGame();
            }
        }
        
        function buyClickUpgrade() {
            if (score >= clickUpgradeCost) {
                score -= clickUpgradeCost;
                baseClickPower += clickPowerGain;
                clickCount++;
                let multiplier = 1.3;
                if (clickCount >= 5) { multiplier = 2.5 + (clickCount * 0.20); }
                clickUpgradeCost = Math.floor(clickUpgradeCost * multiplier);
                clickPowerGain = Math.max(1, Math.floor(clickUpgradeCost * 0.05));
                updateDisplay();
                saveGame();
            }
        }

        function actionEquip(id) {
            let eq = equips[id];
            let isSaleTarget = (isMerchantPresent && !eq.bought && eq.cost > 0);
            let currentCost = isSaleTarget ? Math.floor(eq.cost * 0.7) : eq.cost;

            if (!eq.bought && score >= currentCost) {
                score -= currentCost; 
                eq.bought = true; 
                currentWeapon = id; 
                if (isMerchantPresent) { endMerchant(); } else { updateDisplay(); }
                saveGame();
            } else if (eq.bought) {
                currentWeapon = id; 
                updateDisplay();
                saveGame();
            }
        }
        function changeEquip(id) { currentWeapon = id; updateDisplay(); saveGame(); }

        function buySkill(id) {
            let sk = skills[id];
            let isUnlocked = (sk.req === null || skills[sk.req].learned);
            if (isUnlocked && !sk.learned && score >= sk.cost) {
                score -= sk.cost; sk.learned = true; updateDisplay();
                saveGame();
            }
        }

        // セーブ＆ロードシステム
        const SAVE_KEY = "kakashi_clicker_save_data_v4";

        function saveGame() {
            const saveData = {
                score: score,
                baseClickPower: baseClickPower,
                baseAutoClickRate: baseAutoClickRate,
                upgradeCost: upgradeCost,
                clickUpgradeCost: clickUpgradeCost,
                autoClickGain: autoClickGain,
                clickPowerGain: clickPowerGain,
                autoCount: autoCount,
                clickCount: clickCount,
                currentWeapon: currentWeapon,
                kakashiDefeated: kakashiDefeated,
                currentEnemyIdx: currentEnemyIdx,          
                currentEnemyDefeated: currentEnemyDefeated,  
                kakashiMaxHp: kakashiMaxHp,
                kakashiHp: kakashiHp,
                skillsLearned: {
                    s1: skills.s1.learned, s2: skills.s2.learned, s3: skills.s3.learned, s4: skills.s4.learned
                },
                equipsBought: {
                    w0: equips.w0.bought, w1: equips.w1.bought, w2: equips.w2.bought
                }
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));

            const statusText = document.getElementById("save-status");
            statusText.classList.add("active");
            if (saveMsgTimeout) clearTimeout(saveMsgTimeout);
            saveMsgTimeout = setTimeout(() => { statusText.classList.remove("active"); }, 1500);
        }

        function loadGame() {
            const json = localStorage.getItem(SAVE_KEY);
            if (!json) {
                kakashiMaxHp = enemyDataList[0].hp;
                kakashiHp = kakashiMaxHp;
                return;
            }

            try {
                const saveData = JSON.parse(json);
                score = saveData.score || 0;
                baseClickPower = saveData.baseClickPower || 1;
                baseAutoClickRate = saveData.baseAutoClickRate || 0;
                upgradeCost = saveData.upgradeCost || 100;
                clickUpgradeCost = saveData.clickUpgradeCost || 150;
                autoClickGain = saveData.autoClickGain || 0.5;
                clickPowerGain = saveData.clickPowerGain || 1;
                autoCount = saveData.autoCount || 0;
                clickCount = saveData.clickCount || 0;
                currentWeapon = saveData.currentWeapon || "w0";
                
                kakashiDefeated = saveData.kakashiDefeated || 0;
                currentEnemyIdx = saveData.currentEnemyIdx || 0;
                currentEnemyDefeated = saveData.currentEnemyDefeated || 0;

                let currentEnemy = enemyDataList[currentEnemyIdx];
                kakashiMaxHp = currentEnemy.hp;
                kakashiHp = saveData.kakashiHp !== undefined ? saveData.kakashiHp : kakashiMaxHp;

                if (saveData.skillsLearned) {
                    for (let id in saveData.skillsLearned) { if (skills[id]) skills[id].learned = saveData.skillsLearned[id]; }
                }
                if (saveData.equipsBought) {
                    for (let id in saveData.equipsBought) { if (equips[id]) equips[id].bought = saveData.equipsBought[id]; }
                }
            } catch (e) { console.error("ロード失敗", e); }
        }

        function resetGame() {
            if (confirm("本当にセーブデータを削除して最初からやり直しますか？")) {
                localStorage.removeItem(SAVE_KEY);
                location.reload();
            }
        }

        setInterval(function() {
            let rate = getAutoClickRate();
            if (rate > 0) {
                damageKakashi(rate * (1 / 60));
                updateDisplay();
            }
        }, 1000 / 60);

        setInterval(checkIdleTime, 1000);

        setInterval(saveGame, 10000);
        loadGame();
        updateDisplay();
    </script>
</body>
</html>
