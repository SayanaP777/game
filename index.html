<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>かかし訓練クリッカー</title>
    <style>
        /* 全体のデザイン調整（スマホ向け） */
        body {
            margin: 0;
            padding: 0;
            background-color: #228B22; /* 草原の緑 */
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            /* スマホで連打したときに文字が選択されたり画面がズームしたりするのを防ぐ */
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 獲得ポイントの表示 */
        #score-display {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 訓練用かかし（ボタン） */
        #kakashi {
            width: 160px;
            height: 160px;
            background-color: #8B4513; /* 木の茶色 */
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.05s;
            margin-bottom: 40px;
            -webkit-tap-highlight-color: transparent; /* タップ時の青い影を消す */
        }

        /* かかしをタップしたときのアニメーション */
        #kakashi:active {
            transform: scale(0.92);
        }

        .kakashi-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .kakashi-sub {
            font-size: 0.85rem;
            color: #FFD700; /* 金色 */
            font-weight: bold;
            margin-top: 4px;
        }

        /* アップグレードエリア */
        .upgrade-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 360px;
        }

        /* アップグレードボタンの共通デザイン */
        .btn {
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #323232;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.98);
        }

        #btn-auto {
            background-color: #D2B48C; /* 薄茶色 */
        }

        #btn-click {
            background-color: #F4A460; /* 明るい茶色 */
        }

        /* 購入できないときは少し暗くする */
        .btn:disabled {
            background-color: #999999 !important;
            color: #666666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ステータス表示（最下部） */
        #status-display {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #E0E0E0;
            line-height: 1.5;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <div id="score-display">獲得ポイント：<span id="score">0</span>点</div>

    <div id="kakashi" onclick="attackKakashi()">
        <div class="kakashi-title">訓練用かかし</div>
        <div class="kakashi-sub">＼攻撃せよ！／</div>
    </div>

    <div class="upgrade-container">
        <button id="btn-auto" class="btn" onclick="buyAutoClick()">
            仲間の自動攻撃を雇う（コスト：<span id="cost-auto">10</span>）
        </button>
        <button id="btn-click" class="btn" onclick="buyClickUpgrade()">
            自分の攻撃力を鍛える（コスト：<span id="cost-click">15</span>）
        </button>
    </div>

    <div id="status-display">
        現在の能力 ｜ 自分の攻撃力：<span id="power-click">1</span>点<br>
        仲間の自動攻撃力：毎秒<span id="power-auto">0</span>点
    </div>

    <script>
        // --- ゲームの変数の初期化 ---
        let score = 0;
        let clickPower = 1;
        let autoClickRate = 0;

        let upgradeCost = 10;
        let clickUpgradeCost = 15;

        // --- 画面の表示を更新する関数 ---
        function updateDisplay() {
            // スコアは小数点以下を切り捨てて表示
            document.getElementById("score").innerText = Math.floor(score);
            
            // コストと能力の表示更新
            document.getElementById("cost-auto").innerText = upgradeCost;
            document.getElementById("cost-click").innerText = clickUpgradeCost;
            document.getElementById("power-click").innerText = clickPower;
            document.getElementById("power-auto").innerText = autoClickRate;

            // ポイントが足りないボタンをグレーアウト（無効化）する
            document.getElementById("btn-auto").disabled = (score < upgradeCost);
            document.getElementById("btn-click").disabled = (score < clickUpgradeCost);
        }

        // --- 1. かかしを攻撃（クリック）したとき ---
        function attackKakashi() {
            score += clickPower;
            updateDisplay();
        }

        // --- 2. 自動攻撃を雇う ---
        function buyAutoClick() {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                autoClickRate += 1;
                upgradeCost = Math.floor(upgradeCost * 1.5);
                updateDisplay();
            }
        }

        // --- 3. 自分の攻撃力を鍛える ---
        function buyClickUpgrade() {
            if (score >= clickUpgradeCost) {
                score -= clickUpgradeCost;
                clickPower += 1;
                clickUpgradeCost = Math.floor(clickUpgradeCost * 1.7);
                updateDisplay();
            }
        }

        // --- 仲間の自動攻撃（定期実行ループ） ---
        // 1000ミリ秒（1秒）に60回実行して、滑らかにポイントを増やします
        setInterval(function() {
            if (autoClickRate > 0) {
                score += autoClickRate * (1 / 60);
                updateDisplay();
            }
        }, 1000 / 60);

        // 最初の一回、画面表示をリフレッシュ
        updateDisplay();
    </script>
</body>
</html>
